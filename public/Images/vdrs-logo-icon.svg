<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Van Dyk Recycling Solutions Monogram</title>
  <desc id="desc">Stylised VDRS initials on a blue circular background</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <g fill="#ffffff" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="700">
    <text x="50%" y="52%" font-size="240" text-anchor="middle">VD</text>
    <text x="50%" y="78%" font-size="200" text-anchor="middle">RS</text>
  </g>
</svg>
